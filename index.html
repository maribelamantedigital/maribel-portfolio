<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Maribel Amante — Graphic Designer, Social Media Manager and Virtual Assistant portfolio.">
<title>Maribel Amante | Portfolio</title>

<style>
*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px;
  background:rgba(255,255,255,.97);
  box-shadow:0 2px 14px rgba(0,0,0,.15);
}

nav a{
  color:#000;
  text-decoration:none;
  font-weight:800;
  font-size:14px;
  padding:7px 10px;
}

nav a:hover,
nav a.active{
  color:#ffbd00;
}

main{
  padding-top:50px;
}

.slide{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 10px;
  background:#080808;
  scroll-margin-top:50px;
}

.slide img{
  width:min(1650px,100%);
  height:auto;
  max-height:calc(100vh - 70px);
  object-fit:contain;
  display:block;
}

/* MUSIC PLAYER */
.music{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:1100;
  display:flex;
  align-items:center;
  gap:8px;
  background:#000;
  border:2px solid #ffbd00;
  border-radius:999px;
  padding:7px 10px;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.music button{
  border:0;
  background:#ffbd00;
  color:#000;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  font-weight:900;
  font-size:16px;
}

.music span{
  font-size:12px;
  font-weight:800;
  padding-right:5px;
}

/* MOBILE */
@media(max-width:700px){

  nav{
    justify-content:flex-start;
    overflow-x:auto;
    gap:2px;
  }

  nav a{
    font-size:11px;
    padding:7px 8px;
    white-space:nowrap;
  }

  main{
    padding-top:48px;
  }

  .slide{
    min-height:auto;
    padding:10px 3px;
  }

  .slide img{
    max-height:none;
  }
}
</style>
</head>

<body>

<nav>
  <a href="#home">HOME</a>
  <a href="#about">ABOUT</a>
  <a href="#services">SERVICES</a>
  <a href="#work">WORK</a>
  <a href="#contact">CONTACT</a>
</nav>

<!-- MUSIC -->
<div class="music">
  <button id="musicBtn" type="button">▶</button>
  <span id="musicText">PLAY MUSIC</span>
</div>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<main>

<section class="slide" id="home">
  <img src="home.png" alt="Maribel Amante portfolio home">
</section>

<section class="slide" id="about">
  <img src="about-me.png" alt="About Maribel Amante">
</section>

<section class="slide">
  <img src="education.png" alt="Education">
</section>

<section class="slide">
  <img src="work-experience.png" alt="Work experience">
</section>

<section class="slide">
  <img src="why-hire-me.png" alt="Why hire me">
</section>

<section class="slide">
  <img src="personal-skills.png" alt="Personal skills">
</section>

<section class="slide" id="services">
  <img src="my-services.png" alt="My services">
</section>

<section class="slide" id="work">
  <img src="my-work.png" alt="My work">
</section>

<section class="slide">
  <img src="logo-designs.png" alt="Logo designs">
</section>

<section class="slide">
  <img src="google-form.png" alt="Google Form and Google Sheet integration">
</section>

<section class="slide">
  <img src="project-2.png" alt="MJ Salon project">
</section>

<section class="slide">
  <img src="project-3.png" alt="Yuri's Milk Tea project">
</section>

<section class="slide">
  <img src="software-platform.png" alt="Software and platforms">
</section>

<section class="slide" id="contact">
  <img src="contact.png" alt="Contact information">
</section>

<section class="slide">
  <img src="thank-you.png" alt="Thank you">
</section>

</main>

<script>

const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicBtn');
const label = document.getElementById('musicText');

function updateMusic(){

  const playing = !audio.paused;

  btn.textContent = playing ? '❚❚' : '▶';

  label.textContent = playing ? 'MUSIC ON' : 'PLAY MUSIC';
}

btn.addEventListener('click', async () => {

  if(audio.paused){

    try{
      await audio.play();
    }catch(e){}

  }else{

    audio.pause();

  }

  updateMusic();
});

window.addEventListener('load', async () => {

  try{
    await audio.play();
  }catch(e){}

  updateMusic();

});

document.addEventListener('click', async () => {

  if(audio.paused){

    try{
      await audio.play();
      updateMusic();
    }catch(e){}

  }

},{once:true});

</script>

</body>
</html>
